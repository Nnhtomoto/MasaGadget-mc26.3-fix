name: tidy

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tidy
        run: |
          git rm -q -f settings.json.bak || true
          cat > /tmp/banner.md <<'EOF'
          > **这是 MC 26.3 的修复分支**：基于上游 `36d7522`（4.0.1-RELEASE），修复「村民工作方块 / 床的追踪线只显示两端方框」与「开光影时村民头顶信息渲染出橙灰刀片」两个 26.3 渲染问题。构建产物见 [Releases](https://github.com/Nnhtomoto/MasaGadget-mc26.3-fix/releases/latest)，上游项目见 [plusls/MasaGadget](https://github.com/plusls/MasaGadget)。
          EOF
          python3 - <<'PY'
          from pathlib import Path
          s = Path('README.md').read_text(encoding='utf-8')
          b = Path('/tmp/banner.md').read_text(encoding='utf-8')
          if 'MC 26.3 的修复分支' not in s:
              Path('README.md').write_text(b + '\n' + s, encoding='utf-8')
          PY
          git config user.name "Nnhtomoto"
          git config user.email "Nnhtomoto@users.noreply.github.com"
          git add -A
          git commit -m "docs: add MC 26.3 fix banner; drop local settings backup"
          git push origin HEAD:main
